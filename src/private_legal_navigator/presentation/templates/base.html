<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ base.page_title }} — PrivateLegalNavigator</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='favicon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
</head>
<body>

<a href="#main-content" class="skip-link">Zum Hauptinhalt springen</a>

<header class="app-header" role="banner">
    <div class="app-header__inner">
        <a href="{{ url_for('ui_case_list') }}" class="app-header__home">
            <img src="{{ url_for('static', path='favicon.svg') }}" alt=""
                 class="app-header__logo" width="22" height="22">
            PrivateLegalNavigator
        </a>
        <nav class="app-header__nav" aria-label="Hauptnavigation">
            <a href="{{ url_for('ui_case_list') }}" class="active">Fälle</a>
            <a href="{{ url_for('legal_source_status') }}">Rechtsquellen</a>
            <a href="{{ url_for('legal_source_search_get') }}">Suche</a>
        </nav>
        <span class="app-header__local-badge" aria-label="Nur lokale Verarbeitung">Nur lokal</span>
    </div>
</header>

<div class="main-container">
    <main id="main-content" role="main" tabindex="-1">
        {% block content %}{% endblock %}
    </main>
</div>

<footer class="app-footer" role="contentinfo">
    <strong>Lokale Anwendung — keine Cloud, keine Telemetrie.</strong>
    Rechtliche Gültigkeit nicht bewertet. Menschliche Prüfung erforderlich.
</footer>

</body>
</html>
